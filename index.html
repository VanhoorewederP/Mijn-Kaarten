<!DOCTYPE html>
<html lang="nl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mijn Kaarten</title>
  
  <!-- Manifest voor Android installatie -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Android & Chrome configuratie -->
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- iOS / Apple Safari configuratie (verwijdert adresbalk) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kaarten">
  <link rel="apple-touch-icon" href="icon-1024.jpg">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    body {
      padding-top: var(--sat);
      padding-left: var(--sal);
      padding-right: var(--sar);
      margin: 0;
      background-color: #020617;
    }

    header {
      padding-top: max(1rem, var(--sat));
    }

    nav {
      padding-bottom: max(0.5rem, var(--sab));
    }

    /* --- Geforceerde Portretstand bij kantelen (iOS & Android) --- */
    @media screen and (orientation: landscape) {
      #appContainer {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vh !important;
        height: 100vw !important;
        transform: rotate(-90deg) translateX(-100vh) !important;
        transform-origin: top left !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
      }
    }

    #reader video { object-fit: cover; border-radius: 0.75rem; width: 100% !important; }
    input[type="text"] { font-size: 16px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans select-none antialiased">
  <!-- Alles in appContainer wikkelen -->
  <div id="appContainer" class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="px-4 pb-3 bg-slate-900/95 backdrop-blur shadow-md sticky top-0 z-20 border-b border-slate-800 flex flex-col gap-3">
      <div class="flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          <span>💳</span> Mijn Kaarten
        </h1>
        <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow">
          + Nieuw
        </button>
      </div>

      <!-- Zoekbalk & Sorteerknop -->
      <div class="flex gap-2">
        <div class="relative flex-1">
          <span class="absolute inset-y-0 left-3 flex items-center text-slate-400 pointer-events-none">🔍</span>
          <input id="searchInput" oninput="renderCards()" type="text" placeholder="Zoek kaart..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-blue-500 text-white placeholder-slate-500">
        </div>
        <button onclick="toggleSort()" id="sortBtn" class="bg-slate-800 border border-slate-700 px-3 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white transition flex items-center gap-1">
          <span>🔤</span> <span id="sortLabel">A-Z</span>
        </button>
      </div>

      <div class="flex gap-2 px-4 py-2 bg-slate-900 border-b border-slate-800">
        <button onclick="exportBackup()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition active:scale-95">
          <span>💾</span> Backup
        </button>
        <button onclick="document.getElementById('importFileInput').click()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition active:scale-95">
          <span>📥</span> Herstel
        </button>
        <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importBackup(this)">
      </div>
    </header>

    <!-- Kaartenlijst: 2 kolommen naast elkaar -->
    <main class="p-3 max-w-lg w-full mx-auto flex-1">
      <div id="cardList" class="grid grid-cols-2 gap-3"></div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 z-30 px-6 py-2 flex justify-around items-center">
      <button onclick="switchTab('all')" id="tabAllBtn" class="flex flex-col items-center gap-1 text-blue-500 py-1 transition">
        <span class="text-xl">🗂️</span>
        <span class="text-xs font-semibold">Alle Kaarten</span>
      </button>
      <button onclick="switchTab('favorites')" id="tabFavBtn" class="flex flex-col items-center gap-1 text-slate-400 py-1 transition">
        <span class="text-xl">⭐</span>
        <span class="text-xs font-semibold">Vaakst Gebruikt</span>
      </button>
      <!-- Update Knop -->
      <button onclick="checkForAppUpdate()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 py-1 transition">
        <span class="text-xl" id="updateIcon">🔄</span>
        <span class="text-xs font-semibold">Update</span>
      </button>
    </nav>

    <!-- Modal: Toon Code + Bewerken & Verwijderen -->
    <div id="viewModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50 overflow-y-auto" onclick="closeModalOnBgClick(event)">
      <div id="viewModalContent" class="bg-white text-slate-900 w-full max-w-sm rounded-3xl p-6 flex flex-col items-center gap-4 text-center shadow-2xl my-auto">
        
        <!-- Top in modal -->
        <div class="w-full flex justify-between items-center border-b pb-3">
          <div class="flex items-center gap-2.5 truncate">
            <div id="viewLogoWrapper" class="w-9 h-9 rounded-xl overflow-hidden flex items-center justify-center flex-shrink-0"></div>
            <h2 id="viewTitle" class="text-xl font-extrabold truncate text-slate-800 text-left"></h2>
          </div>
          <button onclick="closeModal('viewModal')" class="text-slate-400 hover:text-slate-700 text-xl font-bold px-2">✕</button>
        </div>
        
        <!-- Renderplek barcode / QR -->
        <div class="w-full flex justify-center py-4 px-2 items-center bg-white rounded-2xl overflow-hidden min-h-[160px]">
          <svg id="barcodeCanvas" class="max-w-full hidden"></svg>
          <div id="qrcodeCanvas" class="hidden flex justify-center"></div>
        </div>

        <div class="w-full bg-slate-100 p-2.5 rounded-xl">
          <p id="viewCode" class="font-mono text-sm tracking-wider font-bold text-slate-700 break-all select-all"></p>
        </div>
        
        <!-- Actieknoppen -->
        <div class="w-full flex flex-col gap-2 pt-2 border-t border-slate-100">
          <div class="flex gap-2">
            <button onclick="editCurrentCard()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-800 py-3 rounded-xl font-semibold text-sm transition active:scale-95 flex items-center justify-center gap-1.5">
              <span>✏️</span> Bewerken
            </button>
            <button onclick="closeModal('viewModal')" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl font-bold text-sm transition active:scale-95 shadow">
              Klaar
            </button>
          </div>
          <button onclick="deleteCurrentCard()" class="w-full py-2 text-xs font-semibold text-red-500 hover:text-red-700 transition">
            🗑️ Kaart Verwijderen
          </button>
        </div>
      </div>
    </div>

    <!-- Modal: Kaart Toevoegen / Bewerken Wizard -->
    <div id="addModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 hidden z-40 overflow-y-auto" onclick="closeModalOnBgClick(event)">
      <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-5 sm:p-6 flex flex-col gap-4 text-white shadow-2xl my-auto max-h-[92vh] overflow-y-auto">
        
        <!-- Header -->
        <div class="flex justify-between items-center pb-2 border-b border-slate-800">
          <h2 id="wizardTitle" class="text-lg font-bold">Stap 1: Scan & Geef Naam</h2>
          <button onclick="closeModal('addModal')" class="text-slate-400 hover:text-white text-lg font-bold p-1">✕</button>
        </div>

        <!-- Duplicaat waarschuwing -->
        <div id="duplicateAlert" class="hidden bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3 flex flex-col gap-2">
          <div class="flex items-center gap-2 text-amber-400 text-xs font-semibold">
            <span>⚠️</span> <span id="duplicateAlertText"></span>
          </div>
          <button id="goToDuplicateBtn" type="button" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold py-1.5 px-3 rounded-xl self-start transition">
            Bekijk bestaande kaart →
          </button>
        </div>

        <!-- STAP 1: CODE & NAAM -->
        <div id="wizardStep1" class="flex flex-col gap-4">
          <!-- Scanner Container -->
          <div id="scanner-container" class="hidden overflow-hidden rounded-2xl bg-black border-2 border-blue-500 relative">
            <div id="reader" style="width: 100%; min-height: 180px;"></div>
          </div>
          
          <div class="grid grid-cols-2 gap-2.5">
            <button id="scanBtn" onclick="toggleScanner()" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition active:scale-95">
              <span id="scanBtnIcon">📷</span> <span id="scanBtnText">Camera</span>
            </button>
            <button onclick="triggerFileImport()" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition active:scale-95">
              🖼️ Screenshot
            </button>
            <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="importFromImage(this)">
          </div>

          <div class="flex flex-col gap-3">
            <div>
              <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Winkelnaam</label>
              <input id="cardName" type="text" placeholder="bv. Colruyt, Delhaize, Decathlon" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 mt-1 focus:outline-none focus:border-blue-500 text-white">
            </div>

            <div>
              <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Code / Barcode</label>
              <input id="cardNumber" type="text" placeholder="Scan of typ code" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 mt-1 font-mono text-sm focus:outline-none focus:border-blue-500 text-white">
            </div>

            <div>
              <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Formaat</label>
              <div class="grid grid-cols-2 gap-2 mt-1">
                <button type="button" id="typeBarcodeBtn" onclick="setType('BARCODE')" class="py-2 rounded-xl text-xs font-bold border border-slate-700 bg-blue-600 text-white transition">Streepjescode</button>
                <button type="button" id="typeQrBtn" onclick="setType('QR_CODE')" class="py-2 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 text-slate-400 transition">QR-Code</button>
              </div>
            </div>
          </div>

          <div class="flex gap-2.5 pt-2">
            <button onclick="closeModal('addModal')" class="flex-1 bg-slate-800 hover:bg-slate-700 py-3 rounded-xl text-sm font-semibold transition active:scale-95">Annuleren</button>
            <button onclick="goToStep2()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-3 rounded-xl text-sm font-bold transition shadow active:scale-95">Volgende: Icoon →</button>
          </div>
        </div>

        <!-- STAP 2: LOGO / AFBEELDING / INITIALEN KIEZEN -->
        <div id="wizardStep2" class="hidden flex flex-col gap-4">
          
          <!-- Preview van de tegel -->
          <div class="flex flex-col items-center justify-center p-3 bg-slate-950 border border-slate-800 rounded-2xl">
            <span class="text-[11px] font-semibold text-slate-400 uppercase mb-2">Voorbeeld Tegel</span>
            <div id="previewTile" class="w-20 h-20 rounded-2xl flex items-center justify-center font-bold text-2xl shadow-inner bg-blue-600 text-white overflow-hidden p-1">
              <span id="previewInitials">CO</span>
            </div>
            <span id="previewName" class="text-sm font-bold text-white mt-2 truncate max-w-[150px]">Colruyt</span>
          </div>

          <!-- Optie A: Online Logo Zoeken -->
          <div class="flex flex-col gap-2">
            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">1. Online Logo Zoeken</label>
            <div class="flex gap-2">
              <input id="logoSearchQuery" type="text" placeholder="bv. Colruyt logo" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
              <button onclick="searchWebLogos()" type="button" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-2 rounded-xl text-xs font-semibold">Zoek</button>
            </div>
            <div id="onlineLogoResults" class="flex gap-2 overflow-x-auto py-1 min-h-[50px] items-center">
              <span class="text-xs text-slate-500">Klik op 'Zoek' voor suggesties</span>
            </div>
          </div>

          <!-- Optie B: Foto van Fysieke Kaart -->
          <div class="flex flex-col gap-2 border-t border-slate-800 pt-3">
            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">2. Foto van Fysieke Kaart</label>
            <button onclick="document.getElementById('cardPhotoInput').click()" type="button" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2">
              📸 Neem Foto van Kaart
            </button>
            <input type="file" id="cardPhotoInput" accept="image/*" capture="environment" class="hidden" onchange="handleCardPhotoUpload(this)">
          </div>

          <!-- Optie C: Kleur & Initialen -->
          <div class="flex flex-col gap-2 border-t border-slate-800 pt-3">
            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">3. Of kies Kleur & Initialen</label>
            <div id="colorSwatches" class="flex gap-2 overflow-x-auto py-1.5 px-0.5">
              <button type="button" onclick="selectColorTile('#2563eb', this)" class="color-btn w-8 h-8 rounded-full bg-blue-600 flex-shrink-0 border-2 border-white ring-2 ring-blue-400"></button>
              <button type="button" onclick="selectColorTile('#16a34a', this)" class="color-btn w-8 h-8 rounded-full bg-green-600 flex-shrink-0 border border-slate-700"></button>
              <button type="button" onclick="selectColorTile('#dc2626', this)" class="color-btn w-8 h-8 rounded-full bg-red-600 flex-shrink-0 border border-slate-700"></button>
              <button type="button" onclick="selectColorTile('#ea580c', this)" class="color-btn w-8 h-8 rounded-full bg-orange-600 flex-shrink-0 border border-slate-700"></button>
              <button type="button" onclick="selectColorTile('#9333ea', this)" class="color-btn w-8 h-8 rounded-full bg-purple-600 flex-shrink-0 border border-slate-700"></button>
              <button type="button" onclick="selectColorTile('#0d9488', this)" class="color-btn w-8 h-8 rounded-full bg-teal-600 flex-shrink-0 border border-slate-700"></button>
              <button type="button" onclick="selectColorTile('#e11d48', this)" class="color-btn w-8 h-8 rounded-full bg-rose-600 flex-shrink-0 border border-slate-700"></button>
              <button type="button" onclick="selectColorTile('#334155', this)" class="color-btn w-8 h-8 rounded-full bg-slate-700 flex-shrink-0 border border-slate-700"></button>
            </div>
          </div>

          <div class="flex gap-2.5 pt-3 border-t border-slate-800">
            <button onclick="goToStep1()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-3 rounded-xl text-sm font-semibold transition">← Terug</button>
            <button onclick="saveFinalCard()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-3 rounded-xl text-sm font-bold transition shadow">Opslaan</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Aangepaste Universele Dialog Modal -->
      <div id="dialogModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-xs rounded-3xl p-6 flex flex-col items-center gap-4 text-center shadow-2xl animate-fade-in">
          <div id="dialogIcon" class="w-12 h-12 rounded-2xl bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center text-2xl">
            ℹ️
          </div>
          <div class="flex flex-col gap-1.5">
            <h3 id="dialogTitle" class="text-base font-bold text-white">Melding</h3>
            <p id="dialogMessage" class="text-xs text-slate-400 leading-relaxed"></p>
          </div>
          <div class="flex gap-2 w-full pt-1">
            <button id="dialogCancelBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-semibold transition active:scale-95 hidden">
              Annuleren
            </button>
            <button id="dialogConfirmBtn" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-xs font-bold transition shadow active:scale-95">
              Begrepen
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Universele Custom Popup Handler ---
    function showAppDialog({ title = 'Melding', message = '', icon = 'ℹ️', confirmText = 'Begrepen', confirmColor = 'bg-blue-600', showCancel = false, cancelText = 'Annuleren' }) {
      return new Promise((resolve) => {
        const modal = document.getElementById('dialogModal');
        const titleEl = document.getElementById('dialogTitle');
        const msgEl = document.getElementById('dialogMessage');
        const iconEl = document.getElementById('dialogIcon');
        const confirmBtn = document.getElementById('dialogConfirmBtn');
        const cancelBtn = document.getElementById('dialogCancelBtn');

        titleEl.innerText = title;
        msgEl.innerText = message;
        iconEl.innerText = icon;
        confirmBtn.innerText = confirmText;
        confirmBtn.className = `flex-1 ${confirmColor} hover:brightness-110 text-white py-2.5 rounded-xl text-xs font-bold transition shadow active:scale-95`;

        if (showCancel) {
          cancelBtn.innerText = cancelText;
          cancelBtn.classList.remove('hidden');
        } else {
          cancelBtn.classList.add('hidden');
        }

        modal.classList.remove('hidden');

        confirmBtn.onclick = () => {
          modal.classList.add('hidden');
          resolve(true);
        };

        cancelBtn.onclick = () => {
          modal.classList.add('hidden');
          resolve(false);
        };
      });
    }

    // Helpers voor Alert & Confirm
    function showAppAlert(message, title = 'Melding', icon = 'ℹ️') {
      return showAppDialog({ title, message, icon, showCancel: false, confirmText: 'Begrepen', confirmColor: 'bg-blue-600' });
    }

    function showAppConfirm(message, title = 'Bevestigen', icon = '❓', confirmText = 'Bevestig', confirmColor = 'bg-red-600') {
      return showAppDialog({ title, message, icon, showCancel: true, confirmText, confirmColor });
    }

    // Overschrijf standaard browser alert zodat er nooit meer een Chrome popup komt
    window.alert = function(msg) {
      showAppAlert(msg);
    };


    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
    
    let cards = JSON.parse(localStorage.getItem('cards') || '[]');
    let html5QrCode = null;
    let currentSelectedType = 'BARCODE';
    let currentTab = 'all'; 
    let sortAsc = true;
    let isProcessingScan = false;
    let isCameraBusy = false;

    let activeViewingIndex = null; // Houdt bij welke kaart momenteel geopend is
    let editingIndex = null;        // null bij nieuwe kaart, getal bij bewerken

    // Tijdelijke wizard data
    let tempCardData = {
      name: '',
      code: '',
      type: 'BARCODE',
      iconType: 'COLOR',
      iconData: '#2563eb'
    };

    // --- Tab Management ---
    function switchTab(tab) {
      currentTab = tab;
      const allBtn = document.getElementById('tabAllBtn');
      const favBtn = document.getElementById('tabFavBtn');

      if (tab === 'all') {
        allBtn.className = 'flex flex-col items-center gap-1 text-blue-500 py-1 transition';
        favBtn.className = 'flex flex-col items-center gap-1 text-slate-400 py-1 transition';
      } else {
        favBtn.className = 'flex flex-col items-center gap-1 text-blue-500 py-1 transition';
        allBtn.className = 'flex flex-col items-center gap-1 text-slate-400 py-1 transition';
      }
      renderCards();
    }

    function toggleSort() {
      sortAsc = !sortAsc;
      document.getElementById('sortLabel').innerText = sortAsc ? 'A-Z' : 'Z-A';
      renderCards();
    }

    function getInitials(name) {
      if (!name) return '';
      const parts = name.trim().split(/\s+/);
      if (parts.length >= 2) {
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }
      return name.slice(0, 2).toUpperCase();
    }

    // --- Render Cards (Zonder kruisjes) ---
    function renderCards() {
      const container = document.getElementById('cardList');
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      container.innerHTML = '';

      let filtered = cards.filter(c => 
        c.name.toLowerCase().includes(query) || c.code.toLowerCase().includes(query)
      );

      if (currentTab === 'favorites') {
        filtered = filtered
          .filter(c => (c.openCount || 0) > 0)
          .sort((a, b) => (b.openCount || 0) - (a.openCount || 0))
          .slice(0, 6);
      } else {
        filtered.sort((a, b) => sortAsc 
          ? a.name.localeCompare(b.name) 
          : b.name.localeCompare(a.name)
        );
      }

      if (filtered.length === 0) {
        const msg = currentTab === 'favorites' 
          ? 'Nog geen vaakst gebruikte kaarten.<br>Open eerst enkele kaarten.' 
          : (query ? 'Geen kaarten gevonden.' : 'Geen kaarten bewaard.<br>Tik op "+ Nieuw" om te beginnen.');
        container.innerHTML = `<div class="col-span-2 text-center text-slate-600 py-16 border border-dashed border-slate-800 rounded-3xl"><p class="text-4xl mb-3">📭</p><p class="text-sm">${msg}</p></div>`;
        return;
      }

      filtered.forEach((card) => {
        const origIndex = cards.findIndex(c => c.name === card.name && c.code === card.code);
        const item = document.createElement('div');
        item.className = 'flex flex-col items-center cursor-pointer active:scale-95 transition-transform';
        item.onclick = () => showCard(origIndex);

        let tileInner = '';
        if (card.iconType === 'IMAGE' && card.iconData) {
          tileInner = `<img src="${card.iconData}" class="w-full h-full object-contain p-2 bg-white" onerror="this.parentElement.style.backgroundColor='#2563eb'; this.parentElement.innerHTML='<span class=\'font-bold text-2xl text-white\'>${getInitials(card.name)}</span>'">`;
        } else {
          tileInner = `<span class="font-bold text-2xl text-white">${getInitials(card.name)}</span>`;
        }

        item.innerHTML = `
          <div class="w-full aspect-square bg-slate-900 border border-slate-800 rounded-3xl flex items-center justify-center overflow-hidden shadow-md" style="${card.iconType !== 'IMAGE' ? `background-color: ${card.iconData || '#2563eb'}` : ''}">
            ${tileInner}
          </div>
          <div class="w-full mt-2 text-center">
            <h3 class="font-bold text-sm text-white truncate px-1">${card.name}</h3>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // --- Show Card ---
    function showCard(index) {
      activeViewingIndex = index;
      const card = cards[index];
      
      card.openCount = (card.openCount || 0) + 1;
      localStorage.setItem('cards', JSON.stringify(cards));

      document.getElementById('viewTitle').innerText = card.name;
      document.getElementById('viewCode').innerText = card.code;
      
      const logoWrapper = document.getElementById('viewLogoWrapper');
      if (card.iconType === 'IMAGE' && card.iconData) {
        logoWrapper.style.backgroundColor = '#ffffff';
        logoWrapper.innerHTML = `<img src="${card.iconData}" class="w-full h-full object-contain bg-white p-0.5">`;
      } else {
        logoWrapper.style.backgroundColor = card.iconData || '#2563eb';
        logoWrapper.innerHTML = `<span class="text-xs font-bold text-white">${getInitials(card.name)}</span>`;
      }

      const barcodeSvg = document.getElementById('barcodeCanvas');
      const qrcodeContainer = document.getElementById('qrcodeCanvas');
      qrcodeContainer.innerHTML = '';

      if (card.type === 'QR_CODE') {
        barcodeSvg.classList.add('hidden');
        qrcodeContainer.classList.remove('hidden');
        new QRCode(qrcodeContainer, {
          text: card.code,
          width: 200,
          height: 200,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        qrcodeContainer.classList.add('hidden');
        barcodeSvg.classList.remove('hidden');
        try {
          JsBarcode(barcodeSvg, card.code, { format: "auto", lineColor: "#000000", width: 2, height: 80, displayValue: false, margin: 5 });
        } catch (e) {
          try { JsBarcode(barcodeSvg, card.code, { format: "CODE128", lineColor: "#000000", width: 2, height: 80, displayValue: false, margin: 5 }); }
          catch (e2) {
            barcodeSvg.classList.add('hidden');
            qrcodeContainer.classList.remove('hidden');
            new QRCode(qrcodeContainer, { text: card.code, width: 200, height: 200 });
          }
        }
      }
      document.getElementById('viewModal').classList.remove('hidden');
    }

    // Aangepaste Promise-based Confirm Dialoog
    function showConfirmDialog({ title, message, icon = '🗑️', confirmText = 'Verwijderen', confirmColor = 'bg-red-600' }) {
      return new Promise((resolve) => {
        const modal = document.getElementById('dialogModal');
        const titleEl = document.getElementById('dialogTitle');
        const msgEl = document.getElementById('dialogMessage');
        const iconEl = document.getElementById('dialogIcon');
        const confirmBtn = document.getElementById('dialogConfirmBtn');
        const cancelBtn = document.getElementById('dialogCancelBtn');

        titleEl.innerText = title;
        msgEl.innerText = message;
        iconEl.innerText = icon;
        confirmBtn.innerText = confirmText;
        confirmBtn.className = `flex-1 ${confirmColor} hover:brightness-110 text-white py-2.5 rounded-xl text-xs font-bold transition shadow active:scale-95`;

        modal.classList.remove('hidden');

        confirmBtn.onclick = () => {
          modal.classList.add('hidden');
          resolve(true);
        };

        cancelBtn.onclick = () => {
          modal.classList.add('hidden');
          resolve(false);
        };
      });
    }

    // Vervang de deleteCurrentCard functie door deze versie:
    async function deleteCurrentCard() {
      if (activeViewingIndex === null) return;
      const card = cards[activeViewingIndex];

      const confirmed = await showAppConfirm(
        `Weet je zeker dat je "${card.name}" permanent wilt verwijderen?`,
        "Kaart Verwijderen",
        "🗑️",
        "Verwijder",
        "bg-red-600"
      );

      if (confirmed) {
        cards.splice(activeViewingIndex, 1);
        localStorage.setItem('cards', JSON.stringify(cards));
        closeModal('viewModal');
        renderCards();
      }
    }

    function editCurrentCard() {
      if (activeViewingIndex === null) return;
      const card = cards[activeViewingIndex];
      editingIndex = activeViewingIndex;

      closeModal('viewModal');

      // Vul wizard met bestaande gegevens
      document.getElementById('cardName').value = card.name;
      document.getElementById('cardNumber').value = card.code;
      document.getElementById('duplicateAlert').classList.add('hidden');
      setType(card.type || 'BARCODE');

      tempCardData = {
        name: card.name,
        code: card.code,
        type: card.type || 'BARCODE',
        iconType: card.iconType || 'COLOR',
        iconData: card.iconData || '#2563eb'
      };

      goToStep1();
      document.getElementById('addModal').classList.remove('hidden');
    }

    // --- Wizard Flow ---
    function openAddModal() {
      editingIndex = null;
      document.getElementById('cardName').value = '';
      document.getElementById('cardNumber').value = '';
      document.getElementById('duplicateAlert').classList.add('hidden');
      setType('BARCODE');
      goToStep1();
      document.getElementById('addModal').classList.remove('hidden');
    }

    function goToStep1() {
      document.getElementById('wizardTitle').innerText = editingIndex !== null ? 'Kaart Bewerken' : 'Stap 1: Scan & Geef Naam';
      document.getElementById('wizardStep1').classList.remove('hidden');
      document.getElementById('wizardStep2').classList.add('hidden');
    }

    function goToStep2() {
      const name = document.getElementById('cardName').value.trim();
      const code = document.getElementById('cardNumber').value.trim();

      if (!name || !code) {
        showAppAlert("Vul eerst zowel een winkelnaam als een code in.", "Gegevens Ontbreken", "⚠️");
        return;
      }
      // Voeg dit toe onderaan in de goToStep2() functie:
      const activeColor = tempCardData.iconData || '#2563eb';
      document.querySelectorAll('#colorSwatches .color-btn').forEach(btn => {
        const isMatch = btn.getAttribute('onclick')?.includes(activeColor);
        btn.className = `color-btn w-8 h-8 rounded-full flex-shrink-0 ${btn.classList.toString().match(/bg-[a-z]+-[0-9]+/)?.[0] || ''} ` + 
          (isMatch ? 'border-2 border-white ring-2 ring-blue-400' : 'border border-slate-700');
      });

      // Duplicaatcontrole (uitsluiten van de kaart die we zelf bewerken)
      const existingNameIndex = cards.findIndex((c, idx) => idx !== editingIndex && c.name.toLowerCase() === name.toLowerCase());
      const existingCodeIndex = cards.findIndex((c, idx) => idx !== editingIndex && c.code.toLowerCase() === code.toLowerCase());

      if (existingNameIndex !== -1 || existingCodeIndex !== -1) {
        const targetIndex = existingNameIndex !== -1 ? existingNameIndex : existingCodeIndex;
        const duplicateField = existingNameIndex !== -1 ? `De naam "${name}"` : `De barcode "${code}"`;
        
        const alertBox = document.getElementById('duplicateAlert');
        const alertText = document.getElementById('duplicateAlertText');
        const alertBtn = document.getElementById('goToDuplicateBtn');
        
        alertText.innerText = `${duplicateField} bestaat al (${cards[targetIndex].name})!`;
        alertBtn.onclick = () => {
          closeModal('addModal');
          showCard(targetIndex);
        };
        alertBox.classList.remove('hidden');
        return;
      }

      forceStopScanner();

      tempCardData.name = name;
      tempCardData.code = code;
      tempCardData.type = currentSelectedType;
      if (!tempCardData.iconData) {
        tempCardData.iconType = 'COLOR';
        tempCardData.iconData = '#2563eb';
      }

      document.getElementById('wizardTitle').innerText = 'Stap 2: Kies Icoon of Kleur';
      document.getElementById('wizardStep1').classList.add('hidden');
      document.getElementById('wizardStep2').classList.remove('hidden');
      document.getElementById('previewName').innerText = name;
      document.getElementById('logoSearchQuery').value = name;
      updateTilePreview();
      searchWebLogos();
    }

    function updateTilePreview() {
      const preview = document.getElementById('previewTile');
      if (tempCardData.iconType === 'IMAGE' && tempCardData.iconData) {
        preview.style.backgroundColor = '#ffffff';
        preview.innerHTML = `<img src="${tempCardData.iconData}" class="w-full h-full object-contain p-1">`;
      } else {
        preview.style.backgroundColor = tempCardData.iconData || '#2563eb';
        preview.innerHTML = `<span id="previewInitials">${getInitials(tempCardData.name)}</span>`;
      }
    }

    function selectColorTile(hex, clickedBtn) {
      tempCardData.iconType = 'COLOR';
      tempCardData.iconData = hex;

      // Update visuele selectiecirkel op de knoppen
      document.querySelectorAll('#colorSwatches .color-btn').forEach(btn => {
        btn.className = btn.className.replace(/border-2 border-white ring-2 ring-blue-400/g, 'border border-slate-700');
      });

      if (clickedBtn) {
        clickedBtn.className = clickedBtn.className.replace('border border-slate-700', 'border-2 border-white ring-2 ring-blue-400');
      }

      updateTilePreview();
    }

    async function searchWebLogos() {
      const query = document.getElementById('logoSearchQuery').value.trim() || tempCardData.name;
      const resultsContainer = document.getElementById('onlineLogoResults');
      resultsContainer.innerHTML = '<span class="text-xs text-slate-400">Zoeken...</span>';

      const clean = query.toLowerCase().replace(/[^a-z0-9]/g, '');
      const urls = [
        `https://logo.clearbit.com/${clean}.be`,
        `https://logo.clearbit.com/${clean}.com`,
        `https://logo.clearbit.com/${clean}.nl`,
        `https://www.google.com/s2/favicons?domain=${clean}.be&sz=128`,
        `https://www.google.com/s2/favicons?domain=${clean}.com&sz=128`
      ];

      resultsContainer.innerHTML = '';
      urls.forEach((url) => {
        const imgBtn = document.createElement('button');
        imgBtn.type = 'button';
        imgBtn.className = 'w-12 h-12 bg-white rounded-xl p-1 border-2 border-slate-700 flex-shrink-0 flex items-center justify-center hover:border-blue-500 transition overflow-hidden';
        imgBtn.innerHTML = `<img src="${url}" class="max-w-full max-h-full object-contain" onerror="this.parentElement.remove()">`;
        imgBtn.onclick = () => {
          tempCardData.iconType = 'IMAGE';
          tempCardData.iconData = url;
          updateTilePreview();
        };
        resultsContainer.appendChild(imgBtn);
      });
    }

    function handleCardPhotoUpload(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 200;
          let w = img.width;
          let h = img.height;
          if (w > h) { h = (h / w) * maxDim; w = maxDim; } 
          else { w = (w / h) * maxDim; h = maxDim; }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          
          tempCardData.iconType = 'IMAGE';
          tempCardData.iconData = canvas.toDataURL('image/jpeg', 0.8);
          updateTilePreview();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveFinalCard() {
      const cardPayload = {
        name: tempCardData.name,
        code: tempCardData.code,
        type: tempCardData.type,
        iconType: tempCardData.iconType,
        iconData: tempCardData.iconData,
        openCount: editingIndex !== null ? (cards[editingIndex].openCount || 0) : 0
      };

      if (editingIndex !== null) {
        cards[editingIndex] = cardPayload;
      } else {
        cards.push(cardPayload);
      }

      localStorage.setItem('cards', JSON.stringify(cards));
      renderCards();
      closeModal('addModal');
    }

    // --- Helper Functions ---
    function setType(type) {
      currentSelectedType = type;
      const bBtn = document.getElementById('typeBarcodeBtn');
      const qBtn = document.getElementById('typeQrBtn');
      if (type === 'QR_CODE') {
        qBtn.className = 'py-2 rounded-xl text-xs font-bold border border-blue-500 bg-blue-600 text-white transition';
        bBtn.className = 'py-2 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 text-slate-400 transition';
      } else {
        bBtn.className = 'py-2 rounded-xl text-xs font-bold border border-blue-500 bg-blue-600 text-white transition';
        qBtn.className = 'py-2 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 text-slate-400 transition';
      }
    }

    function detectCodeType(text, formatName) {
      if (formatName && formatName.includes('QR')) return 'QR_CODE';
      if (text.startsWith('http://') || text.startsWith('https://') || text.includes('www.') || text.length > 28 || text.includes(' ')) {
        return 'QR_CODE';
      }
      return 'BARCODE';
    }

    // --- Scanner Logic ---
    async function toggleScanner() {
      if (isCameraBusy) return;
      const container = document.getElementById('scanner-container');
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

      if (html5QrCode.isScanning) {
        await forceStopScanner();
      } else {
        isCameraBusy = true;
        isProcessingScan = false;
        container.classList.remove('hidden');
        document.getElementById('scanBtnText').innerText = "Stop";
        document.getElementById('scanBtnIcon').innerText = "⏹";
        const btn = document.getElementById('scanBtn');
        btn.classList.remove('bg-slate-800');
        btn.classList.add('bg-red-600');

        try {
          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 150 } },
            (decodedText, decodedResult) => {
              if (isProcessingScan) return;
              isProcessingScan = true;
              if ('vibrate' in navigator) { navigator.vibrate(0); navigator.vibrate(80); }
              
              document.getElementById('cardNumber').value = decodedText;
              const format = decodedResult?.result?.format?.formatName || '';
              setType(detectCodeType(decodedText, format));
              forceStopScanner();
            },
            () => {}
          );
        } catch (err) {
          container.classList.add('hidden');
          resetScanBtnUI();
          showAppAlert("Geef je browser toestemming om de camera te gebruiken in de instellingen.", "Camera Toegang Geweigerd", "📷");
        } finally {
          isCameraBusy = false;
        }
      }
    }

    async function forceStopScanner() {
      if ('vibrate' in navigator) navigator.vibrate(0);
      isProcessingScan = true;
      if (html5QrCode) {
        try {
          if (html5QrCode.isScanning) await html5QrCode.stop();
          html5QrCode.clear();
        } catch (err) {}
      }
      document.getElementById('scanner-container').classList.add('hidden');
      resetScanBtnUI();
      isProcessingScan = false;
      isCameraBusy = false;
    }

    function resetScanBtnUI() {
      document.getElementById('scanBtnText').innerText = "Camera";
      document.getElementById('scanBtnIcon').innerText = "📷";
      const btn = document.getElementById('scanBtn');
      if (btn) {
        btn.classList.remove('bg-red-600');
        btn.classList.add('bg-slate-800');
      }
    }

    function triggerFileImport() {
      forceStopScanner();
      document.getElementById('fileInput').click();
    }

    async function importFromImage(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      const cardInput = document.getElementById('cardNumber');
      cardInput.value = "Bezig met scannen...";

      let scanner = html5QrCode || new Html5Qrcode("reader");
      try {
        const decodedText = await scanner.scanFile(file, false);
        cardInput.value = decodedText;
        setType(detectCodeType(decodedText, ''));
        navigator.vibrate?.(80);
      } catch (err) {
        cardInput.value = "";
        showAppAlert("Er is geen duidelijke barcode of QR-code gevonden op deze foto.", "Niet Herkend", "🔍");
      } finally {
        input.value = '';
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      forceStopScanner();
    }

    function closeModalOnBgClick(e) {
      if (e.target === e.currentTarget) closeModal(e.currentTarget.id);
    }

    // Forceer portrait lock zodra de app geopend wordt (werkt op Android PWA)
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait-primary').catch(() => {
      // Negeer fout indien toestel/browser het niet ondersteunt
      });
    }

    let swRegistration = null;

    // Registreer en bewaar Service Worker registratie
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        swRegistration = reg;

        // Luister of er op de achtergrond een nieuwe versie klaarstaat
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner(newWorker);
            }
          });
        });
      });

      // Herlaad zodra de nieuwe worker actief is
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });
    }

    // Handmatige update check via het knopje
    async function checkForAppUpdate() {
      const icon = document.getElementById('updateIcon');
      icon.classList.add('animate-spin');

      if (!swRegistration) {
        setTimeout(() => {
          icon.classList.remove('animate-spin');
          window.location.reload();
        }, 600);
        return;
      }

      try {
        await swRegistration.update();
        setTimeout(() => {
          icon.classList.remove('animate-spin');
          if (!swRegistration.waiting && !swRegistration.installing) {
            showAppAlert("Je hebt al de meest recente versie van de app!", "Alles Up-to-Date", "✨");
          }
        }, 800);
      } catch (err) {
        icon.classList.remove('animate-spin');
        window.location.reload();
      }
    }

    // Activeer direct de nieuwe update
    function showUpdateBanner(worker) {
      worker.postMessage({ action: 'skipWaiting' });
    }

    // 1. Exporteer naar bestand / Deelmenu (Google Drive, iCloud, etc.)
    async function exportBackup() {
      if (cards.length === 0) {
        showAppAlert("Er zijn nog geen kaarten om een backup van te maken.", "Geen Kaarten", "ℹ️");
        return;
      }

      const backupData = JSON.stringify(cards, null, 2);
      const fileName = `klantenkaarten_backup_${new Date().toISOString().slice(0, 10)}.json`;
      const file = new File([backupData], fileName, { type: 'application/json' });

      // Gebruik native deelmenu op mobiel indien beschikbaar
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Mijn Klantenkaarten Backup',
            text: 'Backup van al mijn klantenkaarten.'
          });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return; // Gebruiker annuleerde het delen
        }
      }

      // Fallback: direct downloaden als bestand
      const blob = new Blob([backupData], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
      showAppAlert("Backup-bestand is gedownload. Sla dit op in Google Drive of iCloud.", "Backup Gelukt", "✅");
    }

    // 2. Importeer en herstel backup
    function importBackup(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = async function(e) {
        try {
          const importedCards = JSON.parse(e.target.result);
          if (!Array.isArray(importedCards)) throw new Error("Ongeldig formaat");

          const confirmed = await showAppConfirm(
            `Wil je ${importedCards.length} kaarten toevoegen/samenvoegen met je huidige collectie?`,
            "Backup Herstellen",
            "📥",
            "Herstel Kaarten",
            "bg-blue-600"
          );

          if (confirmed) {
            // Voorkom duplicaten bij samenvoegen
            importedCards.forEach(newCard => {
              const exists = cards.some(c => c.name.toLowerCase() === newCard.name.toLowerCase() || c.code === newCard.code);
              if (!exists) cards.push(newCard);
            });

            localStorage.setItem('cards', JSON.stringify(cards));
            renderCards();
            showAppAlert("Al je kaarten zijn succesvol hersteld!", "Succes", "🎉");
          }
        } catch (err) {
          showAppAlert("Het geselecteerde bestand is geen geldige backup.", "Fout bij Inladen", "❌");
        } finally {
          input.value = '';
        }
      };

      reader.readAsText(file);
    }

    renderCards();
  </script>
