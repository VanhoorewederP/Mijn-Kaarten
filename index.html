<!DOCTYPE html>
<html lang="nl" class="h-full bg-[#08142c]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mijn Kaarten</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#08142c">
  <meta name="mobile-web-app-capable" content="yes">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kaarten">
  <link rel="apple-touch-icon" href="icon-1024.png">

  <!-- Externe Bibliotheken -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    .navy-mesh-gradient {
      background: linear-gradient(135deg, #08142c 0%, #0e2a66 45%, #1d4ed8 80%, #1e40af 100%);
    }

    html {
      background-color: #08142c;
    }

    body {
      margin: 0;
      padding-left: var(--sal);
      padding-right: var(--sar);
      background-color: #ffffff;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;
    }

    /* Vaste header die nooit mee kan bewegen met momentum */
    header.fixed-app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
    }

    /* Dummy verlenging naar boven voor de statusbalk */
    .status-bar-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: max(1rem, var(--sat));
      background-color: #08142c;
      z-index: 50;
    }

    .header-box {
      padding-top: max(0.9rem, var(--sat));
      padding-left: max(1rem, var(--sal));
      padding-right: max(1rem, var(--sar));
    }

    .nav-box {
      padding-bottom: max(0.75rem, var(--sab));
      padding-left: max(1.5rem, var(--sal));
      padding-right: max(1.5rem, var(--sar));
    }

    #reader video { object-fit: cover; border-radius: 1rem; width: 100% !important; }
    input[type="text"] { font-size: 16px; }

    #barcodeCanvas {
      width: 100% !important;
      height: 120px !important;
      max-height: 140px;
    }

    #qrcodeCanvas img, #qrcodeCanvas canvas {
      margin: 0 auto;
      width: 240px !important;
      height: 240px !important;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col font-sans antialiased bg-white pb-32">

  <!-- Header -->
  <header class="navy-mesh-gradient text-white shadow-lg sticky top-0 z-20 px-4 pb-4 header-box border-b border-blue-400/20">
    <div class="flex justify-between items-center mb-3">
      <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2 drop-shadow-sm">
        <span>💳</span> Mijn Kaarten
      </h1>
      <button onclick="openAddModal()" class="bg-white/15 hover:bg-white/25 active:scale-95 text-white px-4 py-2 rounded-2xl text-xs font-extrabold transition shadow-md border border-white/25 backdrop-blur-sm">
        + Nieuw
      </button>
    </div>

    <!-- Zoekbalk & Sorteerknop -->
    <div class="flex gap-2">
      <div class="relative flex-1">
        <span class="absolute inset-y-0 left-3 flex items-center text-blue-200 pointer-events-none text-sm">🔍</span>
        <input id="searchInput" oninput="renderCards()" type="text" placeholder="Zoek kaart..." class="w-full bg-black/25 backdrop-blur-md border border-white/20 rounded-2xl pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-white focus:ring-2 focus:ring-white/30 text-white placeholder-blue-100/60 transition shadow-inner">
      </div>
      <button onclick="toggleSort()" id="sortBtn" class="bg-black/25 backdrop-blur-md border border-white/20 px-3.5 py-2 rounded-2xl text-xs font-bold text-white hover:bg-white/10 transition flex items-center gap-1.5 shadow-inner">
        <span>🔤</span> <span id="sortLabel">A-Z</span>
      </button>
    </div>
  </header>

  <!-- MIDDEN: Zuiver Wit Kaartenoverzicht -->
  <main class="p-4 max-w-lg w-full mx-auto flex-1 bg-white pt-36">
    <div id="cardList" class="grid grid-cols-2 gap-3.5"></div>
  </main>

  <!-- ONDERSTE VAK: Vloeiende Dock Navigatie -->
  <nav class="fixed bottom-0 inset-x-0 navy-mesh-gradient border-t border-blue-400/20 z-30 px-6 pt-3 nav-box grid grid-cols-3 items-center text-center rounded-t-[2.5rem] shadow-[0_-8px_30px_rgba(8,20,44,0.35)]">
    <button onclick="switchTab('all')" id="tabAllBtn" class="flex flex-col items-center justify-center gap-1 text-blue-200/70 hover:text-white py-1 transition active:scale-95">
      <span class="text-xl leading-none">🗂️</span>
      <span class="text-[11px] font-semibold tracking-tight">Alle Kaarten</span>
    </button>

    <button onclick="switchTab('favorites')" id="tabFavBtn" class="flex flex-col items-center justify-center gap-1 text-white py-1 transition active:scale-95 drop-shadow-[0_2px_10px_rgba(255,255,255,0.4)]">
      <span class="text-xl leading-none">⭐</span>
      <span class="text-[11px] font-extrabold tracking-tight">Vaakst Gebruikt</span>
    </button>

    <button onclick="openManageModal()" id="tabManageBtn" class="flex flex-col items-center justify-center gap-1 text-blue-200/70 hover:text-white py-1 transition active:scale-95">
      <span class="text-xl leading-none">⚙️</span>
      <span class="text-[11px] font-semibold tracking-tight">Beheer</span>
    </button>
  </nav>

  <!-- Modal: Beheer -->
  <div id="manageModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50" onclick="closeModalOnBgClick(event)">
    <div class="bg-white border border-slate-200 w-full max-w-xs rounded-3xl p-6 flex flex-col gap-4 text-slate-900 shadow-2xl my-auto">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="text-base font-extrabold flex items-center gap-2 text-slate-900"><span>⚙️</span> Beheer & Backup</h3>
        <button onclick="closeModal('manageModal')" class="text-slate-400 hover:text-slate-700 font-bold p-1 text-lg">✕</button>
      </div>

      <div class="flex flex-col gap-2.5">
        <button onclick="exportBackup()" class="w-full navy-mesh-gradient text-white border border-blue-400/20 py-3.5 px-4 rounded-2xl text-xs font-bold flex items-center justify-between transition active:scale-95 shadow-md shadow-blue-950/20">
          <span class="flex items-center gap-2.5"><span>💾</span> Backup naar Cloud</span>
          <span class="text-blue-200 font-extrabold">→</span>
        </button>

        <button onclick="document.getElementById('importFileInput').click()" class="w-full navy-mesh-gradient text-white border border-blue-400/20 py-3.5 px-4 rounded-2xl text-xs font-bold flex items-center justify-between transition active:scale-95 shadow-md shadow-blue-950/20">
          <span class="flex items-center gap-2.5"><span>📥</span> Herstel Opgeslagen Backup</span>
          <span class="text-blue-200 font-extrabold">→</span>
        </button>
        <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importBackup(this)">

        <button onclick="checkForAppUpdate()" class="w-full navy-mesh-gradient text-white border border-blue-400/20 py-3.5 px-4 rounded-2xl text-xs font-bold flex items-center justify-between transition active:scale-95 shadow-md shadow-blue-950/20">
          <span class="flex items-center gap-2.5"><span id="updateIcon">🔄</span> Zoek naar Updates</span>
          <span class="text-blue-200 font-extrabold">→</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Toon Code -->
  <div id="viewModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 hidden z-50 overflow-y-auto" onclick="closeModalOnBgClick(event)">
    <div id="viewModalContent" class="bg-white text-slate-900 w-full max-w-md rounded-[2.5rem] p-6 sm:p-8 flex flex-col items-center gap-4 text-center shadow-2xl my-auto border border-slate-100">
      <div class="w-full flex justify-between items-center border-b border-slate-100 pb-3">
        <div class="flex items-center gap-3 truncate">
          <div id="viewLogoWrapper" class="w-11 h-11 rounded-2xl overflow-hidden flex items-center justify-center flex-shrink-0 shadow-sm border border-slate-100"></div>
          <h2 id="viewTitle" class="text-xl font-extrabold truncate text-slate-900 text-left tracking-tight"></h2>
        </div>
        <button onclick="closeModal('viewModal')" class="text-slate-400 hover:text-slate-700 text-2xl font-bold px-2 py-1">✕</button>
      </div>
      
      <div class="w-full flex justify-center py-6 px-3 items-center bg-white rounded-2xl min-h-[220px]">
        <svg id="barcodeCanvas" class="hidden"></svg>
        <div id="qrcodeCanvas" class="hidden flex justify-center"></div>
      </div>

      <div class="w-full bg-slate-50 border border-slate-200/80 p-3.5 rounded-2xl">
        <p id="viewCode" class="font-mono text-base tracking-widest font-extrabold text-slate-900 break-all select-all"></p>
      </div>
      
      <div class="w-full flex flex-col gap-2.5 pt-2 border-t border-slate-100">
        <div class="flex gap-2.5">
          <button onclick="editCurrentCard()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-800 py-3.5 rounded-2xl font-bold text-sm transition active:scale-95 flex items-center justify-center gap-1.5 border border-slate-200">
            <span>✏️</span> Bewerken
          </button>
          <button onclick="closeModal('viewModal')" class="flex-1 navy-mesh-gradient text-white py-3.5 rounded-2xl font-bold text-sm transition active:scale-95 shadow-md border border-blue-400/20">
            Klaar
          </button>
        </div>
        <button onclick="deleteCurrentCard()" class="w-full py-2 text-xs font-bold text-red-600 hover:text-red-700 transition flex items-center justify-center gap-1">
          🗑️ Kaart Verwijderen
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Wizard -->
  <div id="addModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 hidden z-40 overflow-y-auto" onclick="closeModalOnBgClick(event)">
    <div class="bg-white border border-slate-200 w-full max-w-md rounded-[2.5rem] p-6 flex flex-col gap-4 text-slate-900 shadow-2xl my-auto max-h-[92vh] overflow-y-auto">
      
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h2 id="wizardTitle" class="text-lg font-extrabold text-slate-900">Stap 1: Scan & Geef Naam</h2>
        <button onclick="closeModal('addModal')" class="text-slate-400 hover:text-slate-700 text-lg font-bold p-1">✕</button>
      </div>

      <div id="duplicateAlert" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-3 flex flex-col gap-2">
        <div class="flex items-center gap-2 text-amber-800 text-xs font-bold">
          <span>⚠️</span> <span id="duplicateAlertText"></span>
        </div>
        <button id="goToDuplicateBtn" type="button" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold py-1.5 px-3 rounded-xl self-start transition shadow-sm">
          Bekijk bestaande kaart →
        </button>
      </div>

      <!-- STAP 1 -->
      <div id="wizardStep1" class="flex flex-col gap-4">
        <div id="scanner-container" class="hidden overflow-hidden rounded-2xl bg-black border-2 border-blue-700 relative">
          <div id="reader" style="width: 100%; min-height: 180px;"></div>
        </div>
        
        <div class="grid grid-cols-2 gap-2.5">
          <button id="scanBtn" onclick="toggleScanner()" class="bg-slate-100 border border-slate-200 hover:bg-slate-200 py-3 rounded-2xl text-sm font-bold flex items-center justify-center gap-2 transition active:scale-95 text-slate-800 shadow-sm">
            <span id="scanBtnIcon">📷</span> <span id="scanBtnText">Camera</span>
          </button>
          <button onclick="triggerFileImport()" class="bg-slate-100 border border-slate-200 hover:bg-slate-200 py-3 rounded-2xl text-sm font-bold flex items-center justify-center gap-2 transition active:scale-95 text-slate-800 shadow-sm">
            🖼️ Screenshot
          </button>
          <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="importFromImage(this)">
        </div>

        <div class="flex flex-col gap-3">
          <div>
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Winkelnaam</label>
            <input id="cardName" type="text" placeholder="bv. Colruyt, Keurslager, Apotheek" class="w-full bg-slate-100 border border-slate-200 rounded-2xl p-3 mt-1 focus:outline-none focus:border-blue-700 focus:bg-white focus:ring-2 focus:ring-blue-700/20 text-slate-900 transition">
          </div>

          <div>
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Code / Barcode</label>
            <input id="cardNumber" type="text" placeholder="Scan of typ code" class="w-full bg-slate-100 border border-slate-200 rounded-2xl p-3 mt-1 font-mono text-sm focus:outline-none focus:border-blue-700 focus:bg-white focus:ring-2 focus:ring-blue-700/20 text-slate-900 transition">
          </div>

          <div>
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Formaat</label>
            <div class="grid grid-cols-2 gap-2 mt-1">
              <button type="button" id="typeBarcodeBtn" onclick="setType('BARCODE')" class="py-2.5 rounded-xl text-xs font-extrabold navy-mesh-gradient text-white border border-blue-400/20 transition shadow-sm">Streepjescode</button>
              <button type="button" id="typeQrBtn" onclick="setType('QR_CODE')" class="py-2.5 rounded-xl text-xs font-bold border border-slate-200 bg-slate-100 text-slate-600 transition">QR-Code</button>
            </div>
          </div>
        </div>

        <div class="flex gap-2.5 pt-2">
          <button onclick="closeModal('addModal')" class="flex-1 bg-slate-100 hover:bg-slate-200 py-3.5 rounded-2xl text-sm font-bold transition active:scale-95 text-slate-700">Annuleren</button>
          <button onclick="goToStep2()" class="flex-1 navy-mesh-gradient text-white py-3.5 rounded-2xl text-sm font-bold transition shadow-md border border-blue-400/20 active:scale-95">Volgende: Icoon →</button>
        </div>
      </div>

      <!-- STAP 2 -->
      <div id="wizardStep2" class="hidden flex flex-col gap-4">
        
        <!-- Live Preview -->
        <div class="flex flex-col items-center justify-center p-3.5 bg-slate-50 border border-slate-200 rounded-2xl shadow-inner">
          <span class="text-[11px] font-bold text-slate-400 uppercase mb-2">Live Voorbeeld</span>
          <div id="previewTile" class="w-20 h-20 rounded-2xl flex items-center justify-center font-bold text-2xl shadow-md bg-white text-slate-900 overflow-hidden p-2 border border-slate-200">
            <span id="previewInitials">CO</span>
          </div>
          <span id="previewName" class="text-sm font-extrabold text-slate-900 mt-2 truncate max-w-[150px]">Colruyt</span>
        </div>

        <!-- 1. HD Zoeken -->
        <div class="flex flex-col gap-2">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">1. Zoek HD Logo (Merken, Slagers, Apotheken...)</label>
          <div class="flex gap-2">
            <input id="logoSearchQuery" type="text" placeholder="bv. Keurslager, Denaeyer, Colruyt..." class="flex-1 bg-slate-100 border border-slate-200 rounded-2xl px-3.5 py-2 text-xs focus:outline-none focus:border-blue-700 focus:bg-white text-slate-900">
            <button onclick="searchWebLogos()" type="button" class="navy-mesh-gradient text-white px-4 py-2 rounded-2xl text-xs font-bold shadow-sm">Zoek</button>
          </div>
          <div id="onlineLogoResults" class="flex gap-2.5 overflow-x-auto py-2 min-h-[64px] items-center no-scrollbar">
            <span class="text-xs text-slate-400">Typ de naam en klik op 'Zoek'...</span>
          </div>
        </div>

        <!-- 2. Foto Vierkant -->
        <div class="flex flex-col gap-2 border-t border-slate-100 pt-3">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">2. Foto van Fysieke Kaart (Auto-Crop)</label>
          <button onclick="document.getElementById('cardPhotoInput').click()" type="button" class="w-full bg-slate-100 hover:bg-slate-200 border border-slate-200 py-2.5 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 text-slate-800 shadow-sm">
            📸 Neem Foto van Kaart
          </button>
          <input type="file" id="cardPhotoInput" accept="image/*" capture="environment" class="hidden" onchange="handleCardPhotoUpload(this)">
        </div>

        <!-- 3. Categorie Pictogrammen -->
        <div class="flex flex-col gap-2 border-t border-slate-100 pt-3">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">3. Categorie Pictogram</label>
          <div class="flex gap-2 overflow-x-auto py-1 no-scrollbar text-lg">
            <button type="button" onclick="selectCategoryIcon('💊')" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center flex-shrink-0 border border-slate-200">💊</button>
            <button type="button" onclick="selectCategoryIcon('📚')" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center flex-shrink-0 border border-slate-200">📚</button>
            <button type="button" onclick="selectCategoryIcon('🥐')" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center flex-shrink-0 border border-slate-200">🥐</button>
            <button type="button" onclick="selectCategoryIcon('🥩')" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center flex-shrink-0 border border-slate-200">🥩</button>
            <button type="button" onclick="selectCategoryIcon('🍫')" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center flex-shrink-0 border border-slate-200">🍫</button>
            <button type="button" onclick="selectCategoryIcon('☕')" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center flex-shrink-0 border border-slate-200">☕</button>
            <button type="button" onclick="selectCategoryIcon('⛽')" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center flex-shrink-0 border border-slate-200">⛽</button>
            <button type="button" onclick="selectCategoryIcon('🛒')" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center flex-shrink-0 border border-slate-200">🛒</button>
            <button type="button" onclick="selectCategoryIcon('👗')" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center flex-shrink-0 border border-slate-200">👗</button>
            <button type="button" onclick="selectCategoryIcon('✂️')" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center flex-shrink-0 border border-slate-200">✂️</button>
            <button type="button" onclick="selectCategoryIcon('🏊')" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center flex-shrink-0 border border-slate-200">🏊</button>
            <button type="button" onclick="selectCategoryIcon('🎬')" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center flex-shrink-0 border border-slate-200">🎬</button>
            <button type="button" onclick="selectCategoryIcon('🎓')" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center flex-shrink-0 border border-slate-200">🎓</button>
          </div>
        </div>

        <!-- 4. Kleurenpalet -->
        <div class="flex flex-col gap-2 border-t border-slate-100 pt-3">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">4. Achtergrondkleur & Initialen</label>
          <div id="colorSwatches" class="flex gap-2 overflow-x-auto py-1.5 px-0.5 no-scrollbar">
            <button type="button" onclick="selectColorTile('#1e3a8a', this)" class="color-btn w-8 h-8 rounded-full bg-blue-900 flex-shrink-0 border-2 border-white ring-2 ring-blue-900 shadow-sm"></button>
            <button type="button" onclick="selectColorTile('#08142c', this)" class="color-btn w-8 h-8 rounded-full bg-[#08142c] flex-shrink-0 border border-slate-300"></button>
            <button type="button" onclick="selectColorTile('#0f766e', this)" class="color-btn w-8 h-8 rounded-full bg-teal-700 flex-shrink-0 border border-slate-300"></button>
            <button type="button" onclick="selectColorTile('#15803d', this)" class="color-btn w-8 h-8 rounded-full bg-green-700 flex-shrink-0 border border-slate-300"></button>
            <button type="button" onclick="selectColorTile('#b91c1c', this)" class="color-btn w-8 h-8 rounded-full bg-red-700 flex-shrink-0 border border-slate-300"></button>
            <button type="button" onclick="selectColorTile('#c2410c', this)" class="color-btn w-8 h-8 rounded-full bg-orange-700 flex-shrink-0 border border-slate-300"></button>
            <button type="button" onclick="selectColorTile('#581c87', this)" class="color-btn w-8 h-8 rounded-full bg-purple-900 flex-shrink-0 border border-slate-300"></button>
            <button type="button" onclick="selectColorTile('#1e293b', this)" class="color-btn w-8 h-8 rounded-full bg-slate-800 flex-shrink-0 border border-slate-300"></button>
          </div>
        </div>

        <div class="flex gap-2.5 pt-3 border-t border-slate-100">
          <button onclick="goToStep1()" class="flex-1 bg-slate-100 hover:bg-slate-200 py-3.5 rounded-2xl text-sm font-bold transition text-slate-700">← Terug</button>
          <button onclick="saveFinalCard()" class="flex-1 navy-mesh-gradient text-white py-3.5 rounded-2xl text-sm font-bold transition shadow-md border border-blue-400/20">Opslaan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Universele Dialog Modal -->
  <div id="dialogModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white border border-slate-200 w-full max-w-xs rounded-3xl p-6 flex flex-col items-center gap-4 text-center shadow-2xl animate-fade-in">
      <div id="dialogIcon" class="w-12 h-12 rounded-2xl bg-blue-50 border border-blue-100 text-blue-900 flex items-center justify-center text-2xl">
        ℹ️
      </div>
      <div class="flex flex-col gap-1.5">
        <h3 id="dialogTitle" class="text-base font-extrabold text-slate-900">Melding</h3>
        <p id="dialogMessage" class="text-xs text-slate-500 leading-relaxed"></p>
      </div>
      <div class="flex gap-2 w-full pt-1">
        <button id="dialogCancelBtn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl text-xs font-bold transition active:scale-95 hidden">
          Annuleren
        </button>
        <button id="dialogConfirmBtn" class="flex-1 navy-mesh-gradient text-white py-2.5 rounded-xl text-xs font-bold transition shadow-sm active:scale-95 border border-blue-400/20">
          Begrepen
        </button>
      </div>
    </div>
  </div>

  <script>
    let swRegistration = null;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
        swRegistration = reg;
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              newWorker.postMessage({ action: 'skipWaiting' });
            }
          });
        });
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });
    }

    let cards = JSON.parse(localStorage.getItem('cards') || '[]');
    let html5QrCode = null;
    let currentSelectedType = 'BARCODE';
    let currentTab = 'favorites';
    let sortAsc = true;
    let isProcessingScan = false;
    let isCameraBusy = false;

    let activeViewingIndex = null;
    let editingIndex = null;
    let wakeLock = null;

    let tempCardData = {
      name: '',
      code: '',
      type: 'BARCODE',
      iconType: 'COLOR',
      iconData: '#1e3a8a',
      iconSymbol: ''
    };

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    function showAppDialog({ title = 'Melding', message = '', icon = 'ℹ️', confirmText = 'Begrepen', confirmColor = 'navy-mesh-gradient', showCancel = false, cancelText = 'Annuleren' }) {
      return new Promise((resolve) => {
        const modal = document.getElementById('dialogModal');
        document.getElementById('dialogTitle').innerText = title;
        document.getElementById('dialogMessage').innerText = message;
        document.getElementById('dialogIcon').innerText = icon;
        const confirmBtn = document.getElementById('dialogConfirmBtn');
        const cancelBtn = document.getElementById('dialogCancelBtn');

        confirmBtn.innerText = confirmText;
        confirmBtn.className = `flex-1 ${confirmColor} text-white py-2.5 rounded-xl text-xs font-bold transition shadow-sm active:scale-95 border border-blue-400/20`;

        if (showCancel) {
          cancelBtn.innerText = cancelText;
          cancelBtn.classList.remove('hidden');
        } else {
          cancelBtn.classList.add('hidden');
        }

        modal.classList.remove('hidden');

        confirmBtn.onclick = () => { modal.classList.add('hidden'); resolve(true); };
        cancelBtn.onclick = () => { modal.classList.add('hidden'); resolve(false); };
      });
    }

    function showAppAlert(message, title = 'Melding', icon = 'ℹ️') {
      return showAppDialog({ title, message, icon, showCancel: false, confirmText: 'Begrepen' });
    }

    function showAppConfirm(message, title = 'Bevestigen', icon = '❓', confirmText = 'Bevestig', confirmColor = 'bg-red-600') {
      return showAppDialog({ title, message, icon, showCancel: true, confirmText, confirmColor });
    }

    window.alert = function(msg) { showAppAlert(msg); };

    function switchTab(tab) {
      currentTab = tab;
      const allBtn = document.getElementById('tabAllBtn');
      const favBtn = document.getElementById('tabFavBtn');

      if (tab === 'favorites') {
        favBtn.className = 'flex flex-col items-center justify-center gap-1 text-white py-1 transition active:scale-95 drop-shadow-[0_2px_10px_rgba(255,255,255,0.4)]';
        favBtn.querySelector('span:last-child').className = 'text-[11px] font-extrabold tracking-tight';
        allBtn.className = 'flex flex-col items-center justify-center gap-1 text-blue-200/70 hover:text-white py-1 transition active:scale-95';
        allBtn.querySelector('span:last-child').className = 'text-[11px] font-semibold tracking-tight';
      } else {
        allBtn.className = 'flex flex-col items-center justify-center gap-1 text-white py-1 transition active:scale-95 drop-shadow-[0_2px_10px_rgba(255,255,255,0.4)]';
        allBtn.querySelector('span:last-child').className = 'text-[11px] font-extrabold tracking-tight';
        favBtn.className = 'flex flex-col items-center justify-center gap-1 text-blue-200/70 hover:text-white py-1 transition active:scale-95';
        favBtn.querySelector('span:last-child').className = 'text-[11px] font-semibold tracking-tight';
      }
      renderCards();
    }

    function openManageModal() {
      document.getElementById('manageModal').classList.remove('hidden');
    }

    function toggleSort() {
      sortAsc = !sortAsc;
      document.getElementById('sortLabel').innerText = sortAsc ? 'A-Z' : 'Z-A';
      renderCards();
    }

    function getInitials(name) {
      if (!name) return '';
      const parts = name.trim().split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return name.slice(0, 2).toUpperCase();
    }

    // --- Render Kaarten: Altijd 1:1 Vierkant & Originele Beeldkwaliteit ---
    function renderCards() {
      const container = document.getElementById('cardList');
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      container.innerHTML = '';

      let filtered = cards.filter(c => 
        c.name.toLowerCase().includes(query) || c.code.toLowerCase().includes(query)
      );

      if (currentTab === 'favorites') {
        filtered = filtered
          .filter(c => (c.openCount || 0) > 0)
          .sort((a, b) => (b.openCount || 0) - (a.openCount || 0))
          .slice(0, 6);
      } else {
        filtered.sort((a, b) => sortAsc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
      }

      if (filtered.length === 0) {
        const msg = currentTab === 'favorites' 
          ? 'Nog geen vaakst gebruikte kaarten.<br>Tik op "Alle Kaarten" om te openen.' 
          : (query ? 'Geen kaarten gevonden.' : 'Geen kaarten bewaard.<br>Tik op "+ Nieuw" om te beginnen.');
        container.innerHTML = `<div class="col-span-2 text-center text-slate-400 py-16 border border-dashed border-slate-200 rounded-3xl bg-slate-50/50 shadow-sm"><p class="text-4xl mb-3">📭</p><p class="text-sm font-medium leading-relaxed">${msg}</p></div>`;
        return;
      }

      filtered.forEach((card) => {
        const origIndex = cards.findIndex(c => c.name === card.name && c.code === card.code);
        const item = document.createElement('div');
        item.className = 'flex flex-col items-center cursor-pointer active:scale-95 transition-transform group w-full';
        item.onclick = () => showCard(origIndex);

        let tileInner = '';
        let bgStyle = '';

        if (card.iconType === 'IMAGE' && card.iconData) {
          bgStyle = 'background-color: #ffffff;';
          tileInner = `<img src="${card.iconData}" class="w-full h-full object-contain p-2" onerror="this.parentElement.style.backgroundColor='#1e3a8a'; this.parentElement.innerHTML='<span class=\'font-bold text-2xl text-white\'>${getInitials(card.name)}</span>'">`;
        } else if (card.iconType === 'ICON' && card.iconSymbol) {
          bgStyle = `background-color: ${card.iconData || '#1e3a8a'};`;
          tileInner = `<span class="text-4xl drop-shadow">${card.iconSymbol}</span>`;
        } else {
          bgStyle = `background-color: ${card.iconData || '#1e3a8a'};`;
          tileInner = `<span class="font-bold text-2xl text-white drop-shadow">${getInitials(card.name)}</span>`;
        }

        item.innerHTML = `
          <div class="w-full aspect-square border border-slate-200/90 group-hover:border-blue-700 rounded-3xl flex items-center justify-center overflow-hidden shadow-sm hover:shadow-md transition" style="${bgStyle}">
            ${tileInner}
          </div>
          <div class="w-full mt-2 text-center">
            <h3 class="font-bold text-sm text-slate-800 group-hover:text-blue-900 truncate px-1">${card.name}</h3>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function showCard(index) {
      activeViewingIndex = index;
      const card = cards[index];
      
      card.openCount = (card.openCount || 0) + 1;
      localStorage.setItem('cards', JSON.stringify(cards));

      document.getElementById('viewTitle').innerText = card.name;
      document.getElementById('viewCode').innerText = card.code;
      
      const logoWrapper = document.getElementById('viewLogoWrapper');
      if (card.iconType === 'IMAGE' && card.iconData) {
        logoWrapper.style.backgroundColor = '#ffffff';
        logoWrapper.innerHTML = `<img src="${card.iconData}" class="w-full h-full object-contain p-1">`;
      } else if (card.iconType === 'ICON' && card.iconSymbol) {
        logoWrapper.style.backgroundColor = card.iconData || '#1e3a8a';
        logoWrapper.innerHTML = `<span class="text-lg">${card.iconSymbol}</span>`;
      } else {
        logoWrapper.style.backgroundColor = card.iconData || '#1e3a8a';
        logoWrapper.innerHTML = `<span class="text-xs font-bold text-white">${getInitials(card.name)}</span>`;
      }

      const barcodeSvg = document.getElementById('barcodeCanvas');
      const qrcodeContainer = document.getElementById('qrcodeCanvas');
      qrcodeContainer.innerHTML = '';

      if (card.type === 'QR_CODE') {
        barcodeSvg.classList.add('hidden');
        qrcodeContainer.classList.remove('hidden');
        new QRCode(qrcodeContainer, {
          text: card.code,
          width: 260,
          height: 260,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        qrcodeContainer.classList.add('hidden');
        barcodeSvg.classList.remove('hidden');
        try {
          JsBarcode(barcodeSvg, card.code, { 
            format: "auto", 
            lineColor: "#000000", 
            width: 2.6, 
            height: 120, 
            displayValue: false, 
            margin: 8 
          });
        } catch (e) {
          try { 
            JsBarcode(barcodeSvg, card.code, { 
              format: "CODE128", 
              lineColor: "#000000", 
              width: 2.6, 
              height: 120, 
              displayValue: false, 
              margin: 8 
            }); 
          }
          catch (e2) {
            barcodeSvg.classList.add('hidden');
            qrcodeContainer.classList.remove('hidden');
            new QRCode(qrcodeContainer, { text: card.code, width: 260, height: 260 });
          }
        }
      }

      requestWakeLock();
      document.getElementById('viewModal').classList.remove('hidden');
    }

    async function deleteCurrentCard() {
      if (activeViewingIndex === null) return;
      const card = cards[activeViewingIndex];

      const confirmed = await showAppConfirm(
        `Weet je zeker dat je "${card.name}" permanent wilt verwijderen?`,
        "Kaart Verwijderen",
        "🗑️",
        "Verwijder",
        "bg-red-600"
      );

      if (confirmed) {
        cards.splice(activeViewingIndex, 1);
        localStorage.setItem('cards', JSON.stringify(cards));
        closeModal('viewModal');
        renderCards();
      }
    }

    function editCurrentCard() {
      if (activeViewingIndex === null) return;
      const card = cards[activeViewingIndex];
      editingIndex = activeViewingIndex;

      closeModal('viewModal');

      document.getElementById('cardName').value = card.name;
      document.getElementById('cardNumber').value = card.code;
      document.getElementById('duplicateAlert').classList.add('hidden');
      setType(card.type || 'BARCODE');

      tempCardData = {
        name: card.name,
        code: card.code,
        type: card.type || 'BARCODE',
        iconType: card.iconType || 'COLOR',
        iconData: card.iconData || '#1e3a8a',
        iconSymbol: card.iconSymbol || ''
      };

      goToStep1();
      document.getElementById('addModal').classList.remove('hidden');
    }

    function openAddModal() {
      editingIndex = null;
      document.getElementById('cardName').value = '';
      document.getElementById('cardNumber').value = '';
      document.getElementById('duplicateAlert').classList.add('hidden');
      setType('BARCODE');
      goToStep1();
      document.getElementById('addModal').classList.remove('hidden');
    }

    function goToStep1() {
      document.getElementById('wizardTitle').innerText = editingIndex !== null ? 'Kaart Bewerken' : 'Stap 1: Scan & Geef Naam';
      document.getElementById('wizardStep1').classList.remove('hidden');
      document.getElementById('wizardStep2').classList.add('hidden');
    }

    function goToStep2() {
      const name = document.getElementById('cardName').value.trim();
      const code = document.getElementById('cardNumber').value.trim();

      if (!name || !code) {
        showAppAlert("Vul eerst zowel een winkelnaam als een code in.", "Gegevens Ontbreken", "⚠️");
        return;
      }

      const existingNameIndex = cards.findIndex((c, idx) => idx !== editingIndex && c.name.toLowerCase() === name.toLowerCase());
      const existingCodeIndex = cards.findIndex((c, idx) => idx !== editingIndex && c.code.toLowerCase() === code.toLowerCase());

      if (existingNameIndex !== -1 || existingCodeIndex !== -1) {
        const targetIndex = existingNameIndex !== -1 ? existingNameIndex : existingCodeIndex;
        const duplicateField = existingNameIndex !== -1 ? `De naam "${name}"` : `De barcode "${code}"`;
        
        const alertBox = document.getElementById('duplicateAlert');
        const alertText = document.getElementById('duplicateAlertText');
        const alertBtn = document.getElementById('goToDuplicateBtn');
        
        alertText.innerText = `${duplicateField} bestaat al (${cards[targetIndex].name})!`;
        alertBtn.onclick = () => {
          closeModal('addModal');
          showCard(targetIndex);
        };
        alertBox.classList.remove('hidden');
        return;
      }

      forceStopScanner();

      tempCardData.name = name;
      tempCardData.code = code;
      tempCardData.type = currentSelectedType;
      if (!tempCardData.iconData) {
        tempCardData.iconType = 'COLOR';
        tempCardData.iconData = '#1e3a8a';
      }

      document.getElementById('wizardTitle').innerText = 'Stap 2: Kies Icoon of Kleur';
      document.getElementById('wizardStep1').classList.add('hidden');
      document.getElementById('wizardStep2').classList.remove('hidden');
      document.getElementById('previewName').innerText = name;
      document.getElementById('logoSearchQuery').value = name;
      updateTilePreview();
      searchWebLogos();
    }

    function updateTilePreview() {
      const preview = document.getElementById('previewTile');
      if (tempCardData.iconType === 'IMAGE' && tempCardData.iconData) {
        preview.style.backgroundColor = '#ffffff';
        preview.innerHTML = `<img src="${tempCardData.iconData}" class="w-full h-full object-contain p-1.5">`;
      } else if (tempCardData.iconType === 'ICON' && tempCardData.iconSymbol) {
        preview.style.backgroundColor = tempCardData.iconData || '#1e3a8a';
        preview.innerHTML = `<span class="text-4xl drop-shadow">${tempCardData.iconSymbol}</span>`;
      } else {
        preview.style.backgroundColor = tempCardData.iconData || '#1e3a8a';
        preview.innerHTML = `<span id="previewInitials">${getInitials(tempCardData.name)}</span>`;
      }
    }

    function selectCategoryIcon(emoji) {
      tempCardData.iconType = 'ICON';
      tempCardData.iconSymbol = emoji;
      updateTilePreview();
    }

    function selectColorTile(hex, clickedBtn) {
      tempCardData.iconData = hex;
      if (tempCardData.iconType === 'IMAGE') {
        tempCardData.iconType = 'COLOR';
        tempCardData.iconSymbol = '';
      }

      document.querySelectorAll('#colorSwatches .color-btn').forEach(btn => {
        btn.className = btn.className.replace(/border-2 border-white ring-2 ring-blue-900/g, 'border border-slate-300');
      });

      if (clickedBtn) {
        clickedBtn.className = clickedBtn.className.replace('border border-slate-300', 'border-2 border-white ring-2 ring-blue-900');
      }

      updateTilePreview();
    }

    // --- Zuivere HD Logo Zoeker (Google HD Favicons + Vector Resolvers) ---
    async function searchWebLogos() {
      const query = document.getElementById('logoSearchQuery').value.trim() || tempCardData.name;
      const resultsContainer = document.getElementById('onlineLogoResults');
      resultsContainer.innerHTML = '<span class="text-xs text-blue-600 font-semibold animate-pulse">HD logo\'s ophalen...</span>';

      const clean = query.toLowerCase().replace(/[^a-z0-9]/g, '');
      const candidates = new Set();

      // 1. Google 128px HD Favicons (Geen kwaliteitsverlies)
      candidates.add(`https://www.google.com/s2/favicons?domain=${clean}.be&sz=128`);
      candidates.add(`https://www.google.com/s2/favicons?domain=${clean}.com&sz=128`);
      candidates.add(`https://www.google.com/s2/favicons?domain=${clean}.nl&sz=128`);
      candidates.add(`https://www.google.com/s2/favicons?domain=keurslager.be&sz=128`);
      candidates.add(`https://www.google.com/s2/favicons?domain=keurslager.nl&sz=128`);

      // 2. Clearbit & Unavatar HD
      candidates.add(`https://logo.clearbit.com/${clean}.be?size=256`);
      candidates.add(`https://logo.clearbit.com/${clean}.com?size=256`);
      candidates.add(`https://unavatar.io/${clean}.be`);
      candidates.add(`https://unavatar.io/${clean}.com`);

      // 3. DuckDuckGo directe afbeeldingsbronnen
      try {
        const ddgRes = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(`https://duckduckgo.com/i.js?q=${encodeURIComponent(query + ' logo')}&o=json`)}`);
        const ddgData = await ddgRes.json();
        if (ddgData && ddgData.results) {
          ddgData.results.slice(0, 10).forEach(item => {
            if (item.image) candidates.add(item.image);
          });
        }
      } catch (e) {}

      resultsContainer.innerHTML = '';
      if (candidates.size === 0) {
        resultsContainer.innerHTML = '<span class="text-xs text-slate-400">Geen logo gevonden. Neem een foto of kies categorie.</span>';
        return;
      }

      candidates.forEach((url) => {
        const imgBtn = document.createElement('button');
        imgBtn.type = 'button';
        imgBtn.className = 'w-12 h-12 bg-white rounded-2xl p-1.5 border-2 border-slate-200 flex-shrink-0 flex items-center justify-center hover:border-blue-700 transition overflow-hidden shadow-sm aspect-square';
        
        const testImg = document.createElement('img');
        testImg.src = url;
        testImg.className = 'w-full h-full object-contain';
        testImg.onerror = () => imgBtn.remove();
        
        imgBtn.appendChild(testImg);
        imgBtn.onclick = () => {
          // Direct de originele, onvervormde URL toekennen
          tempCardData.iconType = 'IMAGE';
          tempCardData.iconData = url;
          tempCardData.iconSymbol = '';
          updateTilePreview();
        };
        resultsContainer.appendChild(imgBtn);
      });
    }

    // --- Foto met Automatische 1:1 Center-Square Crop ---
    function handleCardPhotoUpload(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const cropSize = 512;
          canvas.width = cropSize;
          canvas.height = cropSize;
          const ctx = canvas.getContext('2d');

          const minDim = Math.min(img.width, img.height);
          const startX = (img.width - minDim) / 2;
          const startY = (img.height - minDim) / 2;

          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, startX, startY, minDim, minDim, 0, 0, cropSize, cropSize);
          
          tempCardData.iconType = 'IMAGE';
          tempCardData.iconData = canvas.toDataURL('image/jpeg', 0.95);
          tempCardData.iconSymbol = '';
          updateTilePreview();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveFinalCard() {
      const cardPayload = {
        name: tempCardData.name,
        code: tempCardData.code,
        type: tempCardData.type,
        iconType: tempCardData.iconType,
        iconData: tempCardData.iconData,
        iconSymbol: tempCardData.iconSymbol || '',
        openCount: editingIndex !== null ? (cards[editingIndex].openCount || 0) : 0
      };

      if (editingIndex !== null) {
        cards[editingIndex] = cardPayload;
      } else {
        cards.push(cardPayload);
      }

      localStorage.setItem('cards', JSON.stringify(cards));
      renderCards();
      closeModal('addModal');
    }

    // --- Backup & Restore ---
    async function exportBackup() {
      if (cards.length === 0) {
        showAppAlert("Er zijn nog geen kaarten om een backup van te maken.", "Geen Kaarten", "ℹ️");
        return;
      }

      const backupData = JSON.stringify(cards, null, 2);
      const fileName = `klantenkaarten_backup_${new Date().toISOString().slice(0, 10)}.json`;
      const file = new File([backupData], fileName, { type: 'application/json' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Mijn Klantenkaarten Backup',
            text: 'Backup van al mijn klantenkaarten.'
          });
          closeModal('manageModal');
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      const blob = new Blob([backupData], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
      closeModal('manageModal');
      showAppAlert("Backup-bestand gedownload. Sla dit veilig op in je cloud.", "Backup Gelukt", "✅");
    }

    function importBackup(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = async function(e) {
        try {
          const importedCards = JSON.parse(e.target.result);
          if (!Array.isArray(importedCards)) throw new Error("Ongeldig formaat");

          const confirmed = await showAppConfirm(
            `Wil je ${importedCards.length} kaarten samenvoegen met je huidige collectie?`,
            "Backup Herstellen",
            "📥",
            "Herstel",
            "navy-mesh-gradient"
          );

          if (confirmed) {
            importedCards.forEach(newCard => {
              const exists = cards.some(c => c.name.toLowerCase() === newCard.name.toLowerCase() || c.code === newCard.code);
              if (!exists) cards.push(newCard);
            });

            localStorage.setItem('cards', JSON.stringify(cards));
            renderCards();
            closeModal('manageModal');
            showAppAlert("Al je kaarten zijn succesvol hersteld!", "Succes", "🎉");
          }
        } catch (err) {
          showAppAlert("Het geselecteerde bestand is geen geldige backup.", "Fout bij Inladen", "❌");
        } finally {
          input.value = '';
        }
      };
      reader.readAsText(file);
    }

    async function checkForAppUpdate() {
      const icon = document.getElementById('updateIcon');
      icon.classList.add('animate-spin');

      try {
        await fetch(`./sw.js?t=${Date.now()}`, { cache: 'no-store' });

        if (swRegistration) {
          await swRegistration.update();
        }

        setTimeout(() => {
          icon.classList.remove('animate-spin');
          if (swRegistration && (swRegistration.waiting || swRegistration.installing)) {
            showAppAlert("Nieuwe versie gevonden! De app herstart nu...", "Bezig met updaten", "🚀");
          } else {
            showAppAlert("Je hebt al de meest recente versie van de app!", "Alles Up-to-Date", "✨");
          }
        }, 1000);
      } catch (err) {
        icon.classList.remove('animate-spin');
        window.location.reload();
      }
    }

    function setType(type) {
      currentSelectedType = type;
      const bBtn = document.getElementById('typeBarcodeBtn');
      const qBtn = document.getElementById('typeQrBtn');
      
      const activeClass = "py-2.5 rounded-xl text-xs font-extrabold navy-mesh-gradient text-white border border-blue-400/20 transition shadow-sm";
      const inactiveClass = "py-2.5 rounded-xl text-xs font-bold border border-slate-200 bg-slate-100 text-slate-600 transition";

      if (type === 'QR_CODE') {
        qBtn.className = activeClass;
        bBtn.className = inactiveClass;
      } else {
        bBtn.className = activeClass;
        qBtn.className = inactiveClass;
      }
    }

    function detectCodeType(text, formatName) {
      if (formatName && formatName.includes('QR')) return 'QR_CODE';
      if (text.startsWith('http://') || text.startsWith('https://') || text.includes('www.') || text.length > 28 || text.includes(' ')) {
        return 'QR_CODE';
      }
      return 'BARCODE';
    }

    async function toggleScanner() {
      if (isCameraBusy) return;
      const container = document.getElementById('scanner-container');
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

      if (html5QrCode.isScanning) {
        await forceStopScanner();
      } else {
        isCameraBusy = true;
        isProcessingScan = false;
        container.classList.remove('hidden');
        document.getElementById('scanBtnText').innerText = "Stop";
        document.getElementById('scanBtnIcon').innerText = "⏹";
        const btn = document.getElementById('scanBtn');
        btn.classList.remove('bg-slate-100', 'text-slate-800');
        btn.classList.add('bg-red-600', 'text-white');

        try {
          await html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 150 } },
            (decodedText, decodedResult) => {
              if (isProcessingScan) return;
              isProcessingScan = true;
              if ('vibrate' in navigator) { navigator.vibrate(0); navigator.vibrate(80); }
              
              document.getElementById('cardNumber').value = decodedText;
              const format = decodedResult?.result?.format?.formatName || '';
              setType(detectCodeType(decodedText, format));
              forceStopScanner();
            },
            () => {}
          );
        } catch (err) {
          container.classList.add('hidden');
          resetScanBtnUI();
          showAppAlert("Geef je browser toestemming om de camera te gebruiken in de instellingen.", "Camera Toegang Geweigerd", "📷");
        } finally {
          isCameraBusy = false;
        }
      }
    }

    async function forceStopScanner() {
      if ('vibrate' in navigator) navigator.vibrate(0);
      isProcessingScan = true;
      if (html5QrCode) {
        try {
          if (html5QrCode.isScanning) await html5QrCode.stop();
          html5QrCode.clear();
        } catch (err) {}
      }
      document.getElementById('scanner-container').classList.add('hidden');
      resetScanBtnUI();
      isProcessingScan = false;
      isCameraBusy = false;
    }

    function resetScanBtnUI() {
      document.getElementById('scanBtnText').innerText = "Camera";
      document.getElementById('scanBtnIcon').innerText = "📷";
      const btn = document.getElementById('scanBtn');
      if (btn) {
        btn.classList.remove('bg-red-600', 'text-white');
        btn.classList.add('bg-slate-100', 'text-slate-800');
      }
    }

    function triggerFileImport() {
      forceStopScanner();
      document.getElementById('fileInput').click();
    }

    async function importFromImage(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      const cardInput = document.getElementById('cardNumber');
      cardInput.value = "Bezig met scannen...";

      let scanner = html5QrCode || new Html5Qrcode("reader");
      try {
        const decodedText = await scanner.scanFile(file, false);
        cardInput.value = decodedText;
        setType(detectCodeType(decodedText, ''));
        navigator.vibrate?.(80);
      } catch (err) {
        cardInput.value = "";
        showAppAlert("Er is geen duidelijke barcode of QR-code gevonden op deze foto.", "Niet Herkend", "🔍");
      } finally {
        input.value = '';
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      if (id === 'viewModal') releaseWakeLock();
      forceStopScanner();
    }

    function closeModalOnBgClick(e) {
      if (e.target === e.currentTarget) closeModal(e.currentTarget.id);
    }


    // Voorkom enkel het naar beneden trekken aan de top op iOS (geen rubber-banding)
    let touchStartY = 0;
    document.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      const touchY = e.touches[0].clientY;
      const isPullingDown = touchY > touchStartY;
      // Als de pagina al helemaal bovenaan staat en je trekt omlaag -> blokkeer
      if (window.scrollY === 0 && isPullingDown) {
        if (e.cancelable) e.preventDefault();
      }
    }, { passive: false });

    renderCards();
  </script>
</body>

      </h1>
      <button onclick="openAddModal()" class="bg-white/15 hover:bg-white/25 active:scale-95 text-white px-4 py-2 rounded-2xl text-xs font-extrabold transition shadow-md border border-white/25 backdrop-blur-sm">
        + Nieuw
      </button>
    </div>

    <div class="flex gap-2">
      <div class="relative flex-1">
        <span class="absolute inset-y-0 left-3 flex items-center text-blue-200 pointer-events-none text-sm">🔍</span>
        <input id="searchInput" oninput="renderCards()" type="text" placeholder="Zoek kaart..." class="w-full bg-black/25 backdrop-blur-md border border-white/20 rounded-2xl pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-white focus:ring-2 focus:ring-white/30 text-white placeholder-blue-100/60 transition shadow-inner">
      </div>
      <button onclick="toggleSort()" id="sortBtn" class="bg-black/25 backdrop-blur-md border border-white/20 px-3.5 py-2 rounded-2xl text-xs font-bold text-white hover:bg-white/10 transition flex items-center gap-1.5 shadow-inner">
        <span>🔤</span> <span id="sortLabel">A-Z</span>
      </button>
    </div>
  </header>
